<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esempi di Esame - Programmazione Orientata agli Oggetti</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Usiamo il common.css dalla cartella assets a livello superiore -->
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
        /* Stili specifici per la pagina indice esami */
        .page-header {
            background-color: var(--bg-header);
            color: var(--text-primary);
            padding: 1.5rem 2rem;
            text-align: left;
            box-shadow: 0 2px 10px var(--shadow-soft);
            border-bottom: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
        }
        .back-link {
            color: var(--accent-secondary);
            text-decoration: none;
            font-size: 1.8rem;
            margin-right: 1.5rem;
            transition: color 0.2s ease;
        }
        .back-link:hover { color: var(--accent-primary); }
        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-primary);
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex-grow: 1;
        }
        .content-category {
            background-color: var(--bg-card);
            padding: 2rem;
            border-radius: var(--border-radius-main);
            margin-bottom: 2rem;
            box-shadow: 0 4px 12px var(--shadow-soft);
        }
        .content-category h2 {
            font-size: 1.5rem;
            color: var(--accent-secondary);
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-soft);
            padding-bottom: 0.5rem;
        }
        .exam-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .exam-list li {
            margin-bottom: 0.75rem;
        }
        .exam-list li a {
            display: block;
            padding: 0.8rem 1rem;
            background-color: var(--bg-deep-space);
            color: var(--accent-primary);
            text-decoration: none;
            border-radius: var(--border-radius-small);
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.2s ease;
            border: 1px solid var(--border-soft);
        }
        .exam-list li a:hover {
            background-color: var(--accent-secondary);
            color: var(--bg-header);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .page-header h1 { font-size: 1.6rem; }
            .container { margin-top: 1rem; padding: 0 0.5rem;}
            .content-category { padding: 1.5rem; }
            .content-category h2 { font-size: 1.3rem; }
            .exam-list li a { padding: 0.7rem 0.8rem; font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <header class="page-header">
        <a href="../OOP_home.html" class="back-link" title="Torna alla Home OOP">←</a> 
        <h1>Esempi di Esame</h1>
    </header>

    <div class="container">
        <main>
            <section class="content-category">
                <h2>Indice delle Tracce Svolte</h2>
                <ul class="exam-list">
                    <li><a href="OOP_barche.html">Esame 04/02/2021: Azienda Noleggio Barche</a></li>
                    <!-- Qui aggiungeremo i link alle altre soluzioni man mano che le creiamo -->
                </ul>
            </section>
        </main>
    </div>

    <footer>
        <p>© 2023 Appunti Corso Programmazione Orientata agli Oggetti</p>
    </footer>
</body>
</html>
