<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmazione Orientata agli Oggetti - Appunti</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep-space: #111827;
            --bg-card: #1f2937;
            --bg-header: #1A202C;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --accent-primary: #60a5fa;
            --accent-secondary: #818cf8;
            --border-soft: rgba(107, 114, 128, 0.2);
            --shadow-soft: rgba(0, 0, 0, 0.25);
            --font-main: 'Nunito Sans', sans-serif;
            --border-radius-main: 12px;
            --border-radius-small: 6px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-main);
            line-height: 1.7;
            color: var(--text-primary);
            background-color: var(--bg-deep-space);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header.page-header {
            background-color: var(--bg-header);
            color: var(--text-primary);
            padding: 1.5rem 2rem;
            text-align: left;
            box-shadow: 0 2px 10px var(--shadow-soft);
            border-bottom: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
        }
        .back-link {
            color: var(--accent-secondary);
            text-decoration: none;
            font-size: 1.8rem;
            margin-right: 1.5rem;
            transition: color 0.2s ease;
        }
        .back-link:hover { color: var(--accent-primary); }
        header.page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-primary);
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        main { width: 100%; }
        .content-category {
            background-color: var(--bg-card);
            padding: 2rem;
            border-radius: var(--border-radius-main);
            margin-bottom: 2rem;
            box-shadow: 0 4px 12px var(--shadow-soft);
        }
        .content-category h2 {
            font-size: 1.5rem;
            color: var(--accent-secondary);
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-soft);
            padding-bottom: 0.5rem;
        }
        .nav-button {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            margin: 0.5rem;
            background-color: var(--accent-primary);
            color: var(--bg-deep-space);
            text-decoration: none;
            border-radius: var(--border-radius-small);
            font-weight: 600;
            text-align: center;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        .nav-button:hover {
            background-color: var(--accent-secondary);
            transform: translateY(-2px);
        }
        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap; 
            gap: 1rem; 
            padding: 1rem 0; 
        }
        footer {
            text-align: center;
            padding: 2rem 0;
            color: var(--text-secondary);
            margin-top: auto; 
            font-size: 0.9rem;
        }
        @media (max-width: 768px) {
            header.page-header h1 { font-size: 1.6rem; }
            .container { margin-top: 1rem; padding: 0 0.5rem;}
            .content-category { padding: 1.5rem; }
            .content-category h2 { font-size: 1.3rem; }
            .nav-button { padding: 0.7rem 1.2rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <header class="page-header">
        <!-- Puoi inserire un link alla tua home page principale se ne hai una -->
        <!-- <a href="../index.html" class="back-link" title="Torna alla Home">←</a> -->
        <h1>Programmazione Orientata agli Oggetti</h1>
    </header>

    <div class="container">
        <main>
            <section class="content-category">
                <h2>Menu Principale</h2>
                <div class="button-container">
                    <a href="lezioni/OOP_lezioni.html" class="nav-button">Lezioni</a>
                    <a href="esami/OOP_esami_home.html" class="nav-button">Esempi di Esame</a>
                </div>
            </section>
        </main>
    </div>

    <footer>
        <p>Appunti di Programmazione Orientata agli Oggetti.</p>
    </footer>
</body>
</html>
